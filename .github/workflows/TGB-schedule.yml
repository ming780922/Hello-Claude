name: Basketball Schedule Check

on:
  repository_dispatch:
    types: [check-basketball-schedule]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main (for scripts)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout data branch (for snapshot)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check schedule
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_GID: ${{ secrets.SHEET_GID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEFAULT_CHAT_ID }}
          MY_TEAM: ${{ secrets.MY_TEAM }}
          SNAPSHOT_PATH: ../data/basketball-schedule.json
        run: node scripts/check-basketball-schedule.js
        working-directory: main

      - name: Commit snapshot to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add basketball-schedule.json
          git diff --staged --quiet || git commit -m "chore: update snapshot $(date -u +'%Y-%m-%d %H:%M')"
          git push origin data
        working-directory: data